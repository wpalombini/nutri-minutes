name: web

on:
  pull_request:
    paths:
      - "web/**"
      - "design/tokens/**"
      - "design/icons/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "design/tokens/**"
      - "design/icons/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      # Dummy API settings: the build reads them, and the bundle check fails if any of them, or
      # their variable names, reach code or pages sent to browsers (ADR 0003).
      API_BASE_URL: https://api.bundle-check.invalid
      CF_ACCESS_CLIENT_ID: bundle-check-client-id.access
      CF_ACCESS_CLIENT_SECRET: bundle-check-client-secret-not-real
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same major as engines.node in web/package.json, which sets the version on Vercel.
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Token contrast check
        working-directory: .
        run: python3 -I design/tokens/check_contrast.py
      - name: Install
        run: npm ci --ignore-scripts
      - name: Generated tokens are up to date
        run: npm run tokens:check
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Client bundle secret check
        run: npm run check:bundle
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser and accessibility tests
        run: npm run test:e2e
      - name: Upload screenshots and test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-screenshots
          path: |
            web/e2e-screenshots/
            web/playwright-report/
            web/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Audit all dependencies for high-severity issues
        run: npm audit --audit-level=high
