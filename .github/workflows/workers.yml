name: workers

on:
  pull_request:
    paths:
      - "workers/**"
      - "compose.yaml"
      - ".env.example"
      - "infra/**"
      - ".github/workflows/workers.yml"
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "compose.yaml"
      - ".env.example"
      - "infra/**"
      - ".github/workflows/workers.yml"

permissions:
  contents: read

concurrency:
  group: workers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers
    services:
      postgres:
        # Keep in step with compose.yaml. Dependabot doesn't update service container images.
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline-ci-only
          POSTGRES_DB: pipeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d pipeline_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://pipeline:pipeline-ci-only@localhost:5432/pipeline_test
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.7"
          working-directory: workers
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Login roles script
        working-directory: .
        run: infra/postgres/test-login-roles.sh

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build workers image for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: workers
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=workers
          cache-to: type=gha,mode=max,scope=workers
