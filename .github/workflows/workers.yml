name: workers

on:
  pull_request:
    paths:
      - "workers/**"
      - ".github/workflows/workers.yml"
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/workers.yml"

permissions:
  contents: read

concurrency:
  group: workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline-ci-only
          POSTGRES_DB: pipeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d pipeline_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://pipeline:pipeline-ci-only@localhost:5432/pipeline_test
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: workers
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
