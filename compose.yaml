# The production stack for the pipeline and its API. The same setup also runs locally for
# development. Settings and secrets come from .env (see .env.example). No ports are open to the
# internet: the database is published on 127.0.0.1 only, and the API is reached only through an
# outbound Cloudflare Tunnel, behind Cloudflare Access (ADR 0003).

name: nutri-minutes

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

x-workers: &workers
  build: ./workers
  image: pipeline-workers:local
  logging: *logging

x-worker-env: &worker-env
  DATABASE_URL: postgresql://pipeline_runner:${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}@db:5432/pipeline
  EUROPE_PMC_CONTACT: ${EUROPE_PMC_CONTACT:?Set EUROPE_PMC_CONTACT in .env}
  EUROPE_PMC_REQUEST_DELAY_SECONDS: ${EUROPE_PMC_REQUEST_DELAY_SECONDS:-}
  SCOUT_INITIAL_DAYS: ${SCOUT_INITIAL_DAYS:-}
  SCOUT_OVERLAP_DAYS: ${SCOUT_OVERLAP_DAYS:-}
  SCOUT_MAX_RESUMES: ${SCOUT_MAX_RESUMES:-}
  TZ: UTC

services:
  db:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pipeline
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Check over TCP: during first-time setup Postgres listens on its socket only, and the
      # other services connect over TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pipeline -d pipeline"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *logging

  # Applies migrations as the schema owner, then exits.
  migrate:
    <<: *workers
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://pipeline:${POSTGRES_PASSWORD}@db:5432/pipeline
    depends_on:
      db:
        condition: service_healthy

  # Creates or updates the login roles for the workers and the API, then exits.
  db-roles:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    entrypoint:
      - sh
      - -c
      - psql -v worker_password="$$WORKER_DB_PASSWORD" -v api_password="$$API_DB_PASSWORD" -f /sql/login-roles.sql
    environment:
      PGHOST: db
      PGUSER: pipeline
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: pipeline
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}
    volumes:
      - ./infra/postgres:/sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  # Runs the schedule in workers/crontab.
  scheduler:
    <<: *workers
    command: ["supercronic", "-passthrough-logs", "/app/crontab"]
    restart: unless-stopped
    # Give a running job time to finish its current page on deploy. Scout resumes if cut off.
    stop_grace_period: 60s
    environment: *worker-env
    depends_on:
      db-roles:
        condition: service_completed_successfully

  # One-off Scout runs: docker compose run --rm scout [--window-start ... --window-end ...]
  scout:
    <<: *workers
    profiles: ["manual"]
    entrypoint: ["python", "-m", "pipeline.scout"]
    command: []
    environment: *worker-env
    depends_on:
      db-roles:
        condition: service_completed_successfully

  # The HTTP API for the web app (ADR 0003). No ports are published: cloudflared reaches it over
  # the Compose network.
  api:
    build: ./api
    image: research-api:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://api_runner:${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}@db:5432/pipeline
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:?Set ACCESS_TEAM_DOMAIN in .env}
      ACCESS_AUD: ${ACCESS_AUD:?Set ACCESS_AUD in .env}
      RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-}
      TZ: UTC
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db-roles:
        condition: service_completed_successfully
    logging: *logging

  # Connects outbound to Cloudflare and forwards the API hostname to the api service. Routing is
  # configured on the tunnel in Cloudflare; the token only identifies this connector.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    # Metrics listen on loopback only, for the health check.
    command: ["tunnel", "--metrics", "127.0.0.1:20241", "run"]
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  db-data:
