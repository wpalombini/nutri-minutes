# Local development and test database. Not for production use.
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline-local-only
      POSTGRES_DB: pipeline
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
